# Azertica Android delivery: signed release APK -> Firebase App Distribution.
#
# Deliberately a NEW file. The seven upstream MOSIP workflows in this directory
# reference MOSIP org secrets and a five-flavour matrix; they are left untouched so
# rebasing onto a new upstream tag stays a readable diff.
name: az-android-release

on:
  workflow_dispatch:
    inputs:
      distribute:
        description: 'Upload to Firebase App Distribution'
        type: boolean
        default: true
      notes:
        description: 'Release notes for testers'
        type: string
        default: 'Automated build'
  push:
    branches: ['release-1.0.x-azertica-nocaps']
    tags: ['az-v*']

permissions:
  contents: read

concurrency:
  group: az-android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Set release version
        shell: bash
        run: |
          # GitHub's expression language has no arithmetic operator. Compute this
          # in the shell, then expose it to every later step and to Gradle.
          echo "AZ_VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "AZ_VERSION_NAME=0.22.2-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Check release secrets
        env:
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.AZ_ANDROID_KEYSTORE_ALIAS }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.AZ_ANDROID_KEYSTORE_PASSWORD }}
          AZ_ANDROID_KEYSTORE_BASE64: ${{ secrets.AZ_ANDROID_KEYSTORE_BASE64 }}
          AZ_FIREBASE_ANDROID_APP_ID: ${{ secrets.AZ_FIREBASE_ANDROID_APP_ID }}
          AZ_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.AZ_FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=0
          for name in RELEASE_KEYSTORE_ALIAS RELEASE_KEYSTORE_PASSWORD \
                      AZ_ANDROID_KEYSTORE_BASE64 AZ_FIREBASE_ANDROID_APP_ID \
                      AZ_FIREBASE_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name:-}" ]; then
              echo "::error::missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      # GUARD. .env is TRACKED and is inlined into the JS bundle at build time by
      # babel (module:react-native-dotenv), so whatever is committed here is the
      # backend the shipped app talks to. Upstream's committed value points at
      # MOSIP's QA host; a build from a stale branch would ship a wallet aimed at
      # someone else's server, and nothing downstream would notice.
      - name: Guard - .env must point at this deployment
        run: |
          host="$(grep -E '^MIMOTO_HOST=' .env | cut -d= -f2-)"
          if [ "$host" != "https://inji.azertica.com" ]; then
            echo "::error::MIMOTO_HOST is '$host', expected https://inji.azertica.com."
            echo "::error::The Azertica .env is uncommitted. Commit it before releasing."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '18.20.8'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'          # AGP 8.4 + the Kotlin jvmTarget patch in android/build.gradle

      - uses: android-actions/setup-android@v3
      - name: Install the NDK the build pins
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;21.4.7075529"

      # Six transitive digitalbazaar deps resolve as git+ssh://git@github.com/.
      # A runner has no SSH key for GitHub, so npm ci fails on them; rewriting to
      # https is the standard fix and needs no credentials for public repos.
      - name: Allow git+ssh dependencies to resolve over https
        run: |
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "git://github.com/"

      - name: Install dependencies
        run: |
          # The telemetry git dependency includes phantomjs-prebuilt. Its abandoned
          # installer hangs while downloading a binary the wallet never uses.
          npm ci --ignore-scripts
          ./node_modules/.bin/patch-package --error-on-fail
          ./node_modules/.bin/jetify

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Decode the upload keystore
        env:
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.AZ_ANDROID_KEYSTORE_ALIAS }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.AZ_ANDROID_KEYSTORE_PASSWORD }}
          AZ_ANDROID_KEYSTORE_BASE64: ${{ secrets.AZ_ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Gradle looks for android/app/release.keystore and SILENTLY falls back to
          # a nonexistent dummy path when absent - the build then "succeeds" unsigned.
          umask 077
          printf '%s' "$AZ_ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          test -s android/app/release.keystore || { echo "::error::keystore decoded empty"; exit 1; }
          keytool -list \
            -keystore android/app/release.keystore \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEYSTORE_ALIAS" >/dev/null

      - name: Build the signed release APK
        working-directory: android
        env:
          # Scoped to Gradle: npm lifecycle scripts and third-party actions never
          # receive signing credentials.
          NODE_ENV: production
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.AZ_ANDROID_KEYSTORE_ALIAS }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.AZ_ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleResidentappRelease --no-daemon --stacktrace

      # Assert identity rather than trust it. output-metadata.json is written by AGP
      # and carries the applicationId and versionCode actually built. Written as a
      # one-liner on purpose: a heredoc inside a YAML block scalar depends on the
      # dedent landing exactly right, and fails obscurely when it does not.
      - name: Verify what was built
        run: |
          meta=android/app/build/outputs/apk/residentapp/release/output-metadata.json
          apk=android/app/build/outputs/apk/residentapp/release/Inji_universal.apk
          ls -la android/app/build/outputs/apk/residentapp/release/
          python3 -c "import json,os,sys; d=json.load(open('$meta')); i=d['applicationId']; c=sorted({e['versionCode'] for e in d['elements']}); w=int(os.environ['AZ_VERSION_CODE']); print('applicationId',i,'versionCodes',c); sys.exit(0 if i=='com.azertica.inji.wallet' and c==[w] else 1)"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$apk" \
            | tee "$RUNNER_TEMP/apksigner.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/apksigner.txt" \
            || { echo "::error::APK is not signed with v2"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: inji-wallet-${{ env.AZ_VERSION_CODE }}
          # Universal only: the per-ABI splits total ~570 MB and App Distribution
          # takes one binary.
          path: android/app/build/outputs/apk/residentapp/release/Inji_universal.apk
          retention-days: 30

      - name: Distribute to testers
        if: github.event_name == 'push' || inputs.distribute == true
        env:
          # A service-account JSON, not the deprecated FIREBASE_TOKEN CLI login.
          AZ_FIREBASE_ANDROID_APP_ID: ${{ secrets.AZ_FIREBASE_ANDROID_APP_ID }}
          AZ_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.AZ_FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          RELEASE_NOTES: ${{ inputs.notes || 'Automated commit build' }}
        run: |
          umask 077
          printf '%s' "$AZ_FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          npm install -g firebase-tools@13
          printf '%s\n\nversionCode %s\ncommit %s\n' \
            "$RELEASE_NOTES" "$AZ_VERSION_CODE" "${GITHUB_SHA::8}" > notes.txt
          # APK, not AAB: App Distribution only accepts an AAB once the Firebase app
          # is linked to a Play developer account, and no Play record exists yet.
          firebase appdistribution:distribute \
            android/app/build/outputs/apk/residentapp/release/Inji_universal.apk \
            --app "$AZ_FIREBASE_ANDROID_APP_ID" \
            --groups "pilot" \
            --release-notes-file notes.txt
